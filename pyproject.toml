[project]
name = "senjin"
version = "0.0.1"
description = "AI technical interviewer that joins Google Meet, interviews candidates locally, and writes an assessment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "ollama>=0.4",
    "mcp>=1.2",
    "pyyaml>=6.0.3",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
    "onnxruntime>=1.31.1",
    "piper-tts>=1.8.0",
    "playwright>=1.64.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senjin"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/senjin/meet/browser_js.py" = ["E501"]  # embedded JavaScript

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["fairness: offline checks that personal cues do not reach the judge"]

[project.scripts]
senjin-chat = "senjin.cli:main"
senjin-assess = "senjin.assess.cli:main"
senjin-data = "senjin.eval.data_cli:main"
senjin-sim = "senjin.eval.sim:main"
senjin-voice = "senjin.audio.cli:main"
senjin-meet = "senjin.meet.cli:main"
senjin-review = "senjin.review.cli:main"
