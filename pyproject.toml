[project]
name = "senjin"
version = "0.0.1"
description = "AI technical interviewer that joins Google Meet, interviews candidates locally, and writes an assessment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "ollama>=0.4",
    "mcp>=1.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senjin"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
senjin-chat = "senjin.cli:main"
